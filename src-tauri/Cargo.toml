[package]
name = "nwn2ee-save-editor"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
autotests = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
integration-tests = []

[[test]]
name = "character"
path = "tests/character.rs"
required-features = ["integration-tests"]

[[test]]
name = "debugging"
path = "tests/debugging.rs"
required-features = ["integration-tests"]

[[test]]
name = "file_operations"
path = "tests/file_operations.rs"
required-features = ["integration-tests"]

[[test]]
name = "gamedata"
path = "tests/gamedata.rs"
required-features = ["integration-tests"]

[[test]]
name = "parsing"
path = "tests/parsing.rs"
required-features = ["integration-tests"]

[[test]]
name = "save_pipeline"
path = "tests/save_pipeline.rs"
required-features = ["integration-tests"]

[[test]]
name = "services"
path = "tests/services.rs"
required-features = ["integration-tests"]

[[test]]
name = "utils"
path = "tests/utils.rs"
required-features = ["integration-tests"]

[[test]]
name = "appearance_anim_routing"
path = "tests/appearance_anim_routing.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = ["process-relaunch-dangerous-allow-symlink-macos"] }

tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
image = { version = "0.25", default-features = false, features = ["tga", "webp", "png", "jpeg"] }
texture2ddecoder = "0.1"
base64 = "0.23"
webp = "0.3"
dotenvy = "0.15"

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Type-safe IPC
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }

# Serialization
rmp-serde = "1.3"
serde_bytes = "0.11"

# Parser dependencies
indexmap = { version = "2.6", features = ["serde"] }
memmap2 = "0.9"
byteorder = "1.5"
encoding_rs = "0.8"
lasso = { version = "0.7", features = ["multi-threaded", "serialize"] }
ahash = "0.8"
smallvec = { version = "1.13", features = ["serde"] }
flate2 = "1.0"
xz2 = "0.1"
lzma-rs = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
libdeflater = "1.0"
miniz_oxide = { version = "0.9", features = ["simd"] }
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
lexical = "7.0"

# Concurrency
rayon = "1.10"
dashmap = "6.1"
parking_lot = "0.12"

# Utilities
walkdir = "2.5"
dirs = "7.0"
once_cell = "1.19"
sha2 = "0.11"
hex = "0.4"
axum = "0.8.8"
tower-http = { version = "0.7", features = ["cors"] }
tokio-stream = "0.1.18"
rand = "0.10.0"
tempfile = "3.13"
sys-locale = "0.3"


[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }

[profile.dev]
opt-level = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
similar_names = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
implicit_hasher = "allow"
needless_pass_by_value = "allow"
unreadable_literal = "allow"
unnecessary_map_or = "allow"
redundant_closure_for_method_calls = "allow"
used_underscore_binding = "allow"
unnecessary_wraps = "allow"
return_self_not_must_use = "allow"
redundant_closure = "allow"
needless_lifetimes = "allow"
map_unwrap_or = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
if_not_else = "allow"
assigning_clones = "allow"
unused_self = "allow"
elidable_lifetime_names = "allow"

# Note: Explicitly allowed due to hard limits and noise reduction
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
case_sensitive_file_extension_comparisons = "allow"
